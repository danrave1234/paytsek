# Supabase CLI project config (local development). Production settings live in
# the Supabase dashboard; secrets are never committed.
project_id = "payrecord"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 200

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "payrecord://auth/callback"
additional_redirect_urls = ["payrecord://auth/callback", "http://localhost:3001/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Password recovery is email-based; no SMS OTP dependency.

[auth.sms]
enabled = false

[analytics]
enabled = false
