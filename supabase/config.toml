# Supabase CLI project config (local development). Production settings live in
# the Supabase dashboard; secrets are never committed.
project_id = "paytsek"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://www.paytsek.online"
additional_redirect_urls = ["paytsek://auth/callback", "https://paytsek.online/auth/callback", "https://www.paytsek.online/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# Password recovery is email-based; no SMS OTP dependency.

[auth.sms]
enabled = false

[analytics]
enabled = false
