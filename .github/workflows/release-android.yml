name: Release Android APK
on: { workflow_dispatch: {}, push: { tags: ['v*'] } }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: npm install --global pnpm@11.9.0
      # Release builds must be able to resolve all workspace package renames.
      - run: pnpm install --no-frozen-lockfile
      - run: |
          pnpm --filter @paytsek/contracts run build
          pnpm --filter @paytsek/receipt-parsers run build
      - name: Build signed APK
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          pnpm exec expo prebuild --platform android --no-install
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/paytsek-release.jks
          cat > android/app/signing.gradle <<'EOF'
          android { signingConfigs { release { storeFile file('paytsek-release.jks'); storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD'); keyAlias System.getenv('ANDROID_KEY_ALIAS'); keyPassword System.getenv('ANDROID_KEY_PASSWORD') } } }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          EOF
          echo "apply from: 'signing.gradle'" >> android/app/build.gradle
          cd android && ./gradlew app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../PayTsek-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.5' }}.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then VERSION="v0.1.5"; fi
          APK="apps/mobile/PayTsek-${VERSION}.apk"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" "${APK}" --clobber
          else
            gh release create "${VERSION}" "${APK}" --title "PayTsek ${VERSION}" --notes "Android release ${VERSION}"
          fi
