name: Release Android APK
on: { workflow_dispatch: {}, push: { tags: ['v*'] } }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: npm install --global pnpm@11.9.0
      # Release builds must be able to resolve all workspace package renames.
      - run: pnpm install --no-frozen-lockfile
      - run: |
          pnpm --filter @paytsek/contracts run build
          pnpm --filter @paytsek/receipt-parsers run build
      - name: Resolve release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME}"
          else
            APP_VERSION=$(sed -n "s/.*version: '\([^']*\)'.*/\1/p" apps/mobile/app.config.ts | head -n 1)
            test -n "${APP_VERSION}"
            RELEASE_VERSION="v${APP_VERSION}"
          fi
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "${GITHUB_ENV}"
      - name: Build signed APK
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$EXPO_PUBLIC_API_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          pnpm exec expo prebuild --platform android --no-install
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/paytsek-release.jks
          cat > android/app/signing.gradle <<'EOF'
          android { signingConfigs { release { storeFile file('paytsek-release.jks'); storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD'); keyAlias System.getenv('ANDROID_KEY_ALIAS'); keyPassword System.getenv('ANDROID_KEY_PASSWORD') } } }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          EOF
          echo "apply from: 'signing.gradle'" >> android/app/build.gradle
          cd android && ./gradlew app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../PayTsek-${RELEASE_VERSION}.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="apps/mobile/PayTsek-${RELEASE_VERSION}.apk"
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_VERSION}" "${APK}" --clobber
          else
            gh release create "${RELEASE_VERSION}" "${APK}" --title "PayTsek ${RELEASE_VERSION}" --notes "Android release ${RELEASE_VERSION}"
          fi
