name: Release Android APK
on: { workflow_dispatch: {}, push: { tags: ['v*'] } }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter @paytsek/contracts run build
          pnpm --filter @paytsek/receipt-parsers run build
          rm -rf apps/mobile/node_modules/@paytsek/receipt-parsers/dist
          cp -R packages/receipt-parsers/dist apps/mobile/node_modules/@paytsek/receipt-parsers/dist
      - name: Build signed APK
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          pnpm exec expo prebuild --platform android --no-install
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/paytsek-release.jks
          cat > android/app/signing.gradle <<'EOF'
          android { signingConfigs { release { storeFile file('paytsek-release.jks'); storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD'); keyAlias System.getenv('ANDROID_KEY_ALIAS'); keyPassword System.getenv('ANDROID_KEY_PASSWORD') } } }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          EOF
          echo "apply from: 'signing.gradle'" >> android/app/build.gradle
          cd android && ./gradlew app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../PayTsek-${{ github.ref_name || 'manual' }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v0.1.5' }}
          name: PayTsek ${{ github.ref_name || 'v0.1.5' }}
          files: apps/mobile/PayTsek-*.apk
