name: Release Android APK

# Builds a signed APK on EAS and attaches it to a GitHub Release.
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   EXPO_TOKEN                 https://expo.dev/accounts/danrave1234/settings/access-tokens
#   ANDROID_KEYSTORE_BASE64    base64 of apps/mobile/credentials/android-upload.jks
#   ANDROID_KEYSTORE_PASSWORD  keystorePassword from apps/mobile/credentials.json
#   ANDROID_KEY_ALIAS          keyAlias from apps/mobile/credentials.json (payrecord)
#   ANDROID_KEY_PASSWORD       keyPassword from apps/mobile/credentials.json

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # expo-github-action authenticates its own step, but plain `run:` steps do
    # not inherit that session, so `eas build` reports "An Expo user account is
    # required". The token has to be in the job environment.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      # An empty EXPO_TOKEN makes expo-github-action *skip* authentication and
      # report success, so the run only fails later at `eas build` with a
      # misleading "no account" error. Fail here instead, with the reason.
      - name: Check EXPO_TOKEN is set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is empty or unset. Set it with:"
            echo "::error::  gh secret set EXPO_TOKEN --repo ${{ github.repository }} --body <token>"
            echo "::error::Generate one at https://expo.dev/settings/access-tokens"
            exit 1
          fi
          echo "EXPO_TOKEN is present (${#EXPO_TOKEN} characters)."

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - name: Restore Android signing credentials
        working-directory: apps/mobile
        run: |
          mkdir -p credentials
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > credentials/android-upload.jks
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "credentials/android-upload.jks",
                "keystorePassword": "$ANDROID_KEYSTORE_PASSWORD",
                "keyAlias": "$ANDROID_KEY_ALIAS",
                "keyPassword": "$ANDROID_KEY_PASSWORD"
              }
            }
          }
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build APK on EAS
        working-directory: apps/mobile
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > build.json
          cat build.json
          echo "APK_URL=$(node -p "JSON.parse(require('fs').readFileSync('build.json','utf8'))[0].artifacts.buildUrl")" >> "$GITHUB_ENV"

      - name: Download APK
        # A second, stable-named copy so payrecord.ph/download/android can link
        # to a URL that never changes between releases.
        run: |
          curl -fL "$APK_URL" -o "PayRecord-${GITHUB_REF_NAME}.apk"
          cp "PayRecord-${GITHUB_REF_NAME}.apk" PayRecord-latest.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PayRecord ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            PayRecord-${{ github.ref_name }}.apk
            PayRecord-latest.apk
