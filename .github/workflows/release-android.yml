name: Release Android APK
on: { workflow_dispatch: {}, push: { tags: ['v*'] } }
permissions: { contents: read, actions: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: android-release-build
      cancel-in-progress: true
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - name: Validate new immutable version, current main and exact CI commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release-gate.mjs --wait
      - id: metadata
        run: |
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          pnpm --filter @paytsek/contracts run build
          pnpm --filter @paytsek/receipt-parsers run build
      - name: Build signed APK
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$EXPO_PUBLIC_API_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          trap 'rm -f android/app/paytsek-release.jks android/app/signing.gradle' EXIT
          pnpm exec expo prebuild --platform android --no-install
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/paytsek-release.jks
          cat > android/app/signing.gradle <<'EOF'
          android { signingConfigs { release { storeFile file('paytsek-release.jks'); storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD'); keyAlias System.getenv('ANDROID_KEY_ALIAS'); keyPassword System.getenv('ANDROID_KEY_PASSWORD') } } }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          EOF
          echo "apply from: 'signing.gradle'" >> android/app/build.gradle
          (cd android && ./gradlew app:assembleRelease :payment-collector:testReleaseUnitTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8")
          keytool -exportcert -keystore android/app/paytsek-release.jks -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD -file release-cert.der
          test -s release-cert.der || { echo 'Release signing certificate could not be exported.' >&2; exit 1; }
      - name: Stage signed APK
        working-directory: apps/mobile
        run: |
          SOURCE_APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$SOURCE_APK" || { echo 'Signed release APK was not produced at the expected path.' >&2; exit 1; }
          cp "$SOURCE_APK" "PayTsek-${RELEASE_VERSION}.apk"
      - name: Verify APK signing identity
        working-directory: apps/mobile
        run: |
          APK="PayTsek-${RELEASE_VERSION}.apk"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > apk-signature.txt
          EXPECTED_CERT=$(openssl dgst -sha256 release-cert.der | awk '{print $NF}' | tr '[:upper:]' '[:lower:]' | tr -d ':')
          ACTUAL_CERT=$(awk '/certificate SHA-256 digest:/ { print $NF; exit }' apk-signature.txt | tr '[:upper:]' '[:lower:]' | tr -d ':\r')
          [[ "$EXPECTED_CERT" =~ ^[0-9a-f]{64}$ ]] || { echo 'Expected signing certificate digest could not be derived.' >&2; exit 1; }
          [[ "$ACTUAL_CERT" =~ ^[0-9a-f]{64}$ ]] || { echo 'APK signing certificate digest could not be read.' >&2; exit 1; }
          test "$EXPECTED_CERT" = "$ACTUAL_CERT" || { echo 'APK signing certificate does not match the release keystore.' >&2; exit 1; }
          echo "APK_CERT_SHA256=$ACTUAL_CERT" >> "$GITHUB_ENV"
      - name: Verify APK package and version
        working-directory: apps/mobile
        run: |
          APK="PayTsek-${RELEASE_VERSION}.apk"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/aapt" dump badging "$APK" > apk-badging.txt
          grep -q "name='ph.paytsek.app'" apk-badging.txt || { echo 'APK package name is not ph.paytsek.app.' >&2; exit 1; }
          grep -q "versionCode='$RELEASE_VERSION_CODE'" apk-badging.txt || { echo 'APK versionCode does not match app.config.ts.' >&2; exit 1; }
          grep -q "versionName='${RELEASE_VERSION#v}'" apk-badging.txt || { echo 'APK versionName does not match app.config.ts.' >&2; exit 1; }
      - name: Create checksum and immutable release manifest
        working-directory: apps/mobile
        run: |
          APK="PayTsek-${RELEASE_VERSION}.apk"
          sha256sum "$APK" > "${APK}.sha256"
          node ../../scripts/ci/release-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: signed-android-release
          path: |
            apps/mobile/PayTsek-*.apk
            apps/mobile/PayTsek-*.apk.sha256
            apps/mobile/release-manifest.json
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write, actions: read }
    concurrency:
      group: android-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          # Publication uses built-in Node modules and the downloaded artifact only.
          package-manager-cache: false
      - uses: actions/download-artifact@v5
        with:
          name: signed-android-release
          path: release-artifacts
      - name: Recheck supersession and immutable release immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release-gate.mjs
      - name: Publish verified APK and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="release-artifacts/PayTsek-${RELEASE_VERSION}.apk"
          CHECKSUM="${APK}.sha256"
          NOTES="apps/mobile/RELEASE_NOTES.md"
          (cd release-artifacts && sha256sum --check "PayTsek-${RELEASE_VERSION}.apk.sha256")
          # A failed upload leaves a non-public draft; no prior release is overwritten.
          gh release create "$RELEASE_VERSION" "$APK" "$CHECKSUM" release-artifacts/release-manifest.json --draft --target "$RELEASE_SHA" --title "PayTsek $RELEASE_VERSION" --notes-file "$NOTES"
          gh release edit "$RELEASE_VERSION" --draft=false --latest
