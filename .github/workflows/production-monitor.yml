name: Production availability
on:
  schedule: [{ cron: '7,22,37,52 * * * *' }]
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: production-availability
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          # No dependencies or pnpm executable are needed by this HTTP monitor.
          package-manager-cache: false
      - name: Check public availability and optional private readiness
        env:
          # Optional repository secret; must match Vercel's CRON_SECRET.
          # Without it, the monitor performs public HTTP liveness checks only.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/ci/monitor-production.mjs
