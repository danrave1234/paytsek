name: Dependency audit
on:
  schedule: [{ cron: '17 1 * * 1' }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Production dependency advisories
        run: pnpm audit --prod --audit-level high
      - name: Triage guidance
        if: failure()
        run: |
          echo '### Dependency audit needs triage' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect reachability, affected feature/version and official patched versions. Patch compatible packages first; keep Expo packages SDK-compatible. Never auto-merge forced major upgrades or treat an advisory as proof of exploitation. See .github/SECURITY_TRIAGE.md.' >> "$GITHUB_STEP_SUMMARY"
