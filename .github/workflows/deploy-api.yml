name: Deploy API

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-api-production
  # Never interrupt committed schema changes before their application is deployed.
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy production API
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-api
      url: https://api.paytsek.online
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup
      - name: Require successful CI for current main (including manual runs)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/deploy-gate.mjs
      - name: Install deployment tools
        if: steps.gate.outputs.deploy == 'true'
        run: npm install --global vercel@62.0.0
      - name: Validate deployment secrets
        if: steps.gate.outputs.deploy == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          test -n "${DATABASE_URL}"
          test -n "${VERCEL_TOKEN}"
          test -n "${VERCEL_ORG_ID}"
          test -n "${VERCEL_PROJECT_ID}"
      - name: Pull paytsek-api production configuration
        if: steps.gate.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}" --scope=danrave1234s-projects
      - name: Verify linked project and private readiness configuration
        if: steps.gate.outputs.deploy == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/ci/verify-vercel-config.mjs
      - name: Build production API
        if: steps.gate.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="${VERCEL_TOKEN}" --scope=danrave1234s-projects
      - name: Recheck current main before entering migration and promotion
        if: steps.gate.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/deploy-gate.mjs --check-only
      - name: Apply pending database migrations
        if: steps.gate.outputs.deploy == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
        run: node supabase/apply-migrations.mjs
      - name: Deploy prebuilt API
        if: steps.gate.outputs.deploy == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --yes --env PAYTSEK_BUILD_SHA=${{ steps.gate.outputs.sha }} --token="${VERCEL_TOKEN}" --scope=danrave1234s-projects)
          echo "url=${DEPLOYMENT_URL}" >> "${GITHUB_OUTPUT}"
          echo "### API deployment" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Production: https://api.paytsek.online" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Deployment: ${DEPLOYMENT_URL}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Commit: ${{ github.event.workflow_run.head_sha || github.sha }}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Verify production readiness and deployed commit
        if: steps.gate.outputs.deploy == 'true'
        env:
          PAYTSEK_BUILD_SHA: ${{ steps.gate.outputs.sha }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/ci/verify-deployment.mjs
