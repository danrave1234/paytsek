name: CI
on:
  push: { branches: [main] }
  pull_request: {}
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.paths.outputs.native }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'native=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(modules/|apps/mobile/(android/|plugins/|app.config.ts|package.json)|packages/receipt-parsers/|pnpm-lock.yaml|.github/)'; then
            echo 'native=true' >> "$GITHUB_OUTPUT"
          else
            echo 'native=false' >> "$GITHUB_OUTPUT"
          fi
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter @paytsek/contracts run build
      - run: pnpm --filter @paytsek/receipt-parsers run build
      - run: pnpm -r run typecheck
      - run: pnpm --filter @paytsek/api test
      - run: pnpm --filter @paytsek/contracts test
      - run: pnpm --filter @paytsek/receipt-parsers test
      - run: pnpm --filter @paytsek/mobile test
      - run: node --test scripts/ci/*.test.mjs
      - run: pnpm --filter @paytsek/web run build
      - run: git diff --check
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Synthetic local-only service credentials; never a production project.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Start isolated Supabase
        run: |
          mkdir -p "$RUNNER_TEMP/paytsek-ci/supabase"
          cp .github/supabase/config.toml "$RUNNER_TEMP/paytsek-ci/supabase/config.toml"
          npx --yes supabase@2.119.0 --workdir "$RUNNER_TEMP/paytsek-ci" start --exclude studio,imgproxy,edge-runtime,logflare,vector > /dev/null
      - name: Verify migration tracking and repeated application
        run: |
          node supabase/apply-migrations.mjs
          node supabase/apply-migrations.mjs
      - name: Build server for database service integration tests
        run: |
          pnpm --filter @paytsek/contracts run build
          pnpm --filter @paytsek/receipt-parsers run build
          pnpm --filter @paytsek/api run build
      - name: Verify database authorization and data invariants
        run: node scripts/ci/database-invariants.mjs
      - name: Stop isolated Supabase
        if: always()
        run: npx --yes supabase@2.119.0 --workdir "$RUNNER_TEMP/paytsek-ci" stop --no-backup
  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: pnpm --filter @paytsek/contracts run build && pnpm --filter @paytsek/receipt-parsers run build
      - working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Compile app and verify native notification parser parity
        working-directory: apps/mobile/android
        run: ./gradlew :app:compileDebugKotlin :payment-collector:testDebugUnitTest --no-daemon
  required:
    name: Required checks
    if: always()
    needs: [changes, verify, database, native]
    runs-on: ubuntu-latest
    steps:
      - env:
          VERIFY: ${{ needs.verify.result }}
          CHANGES: ${{ needs.changes.result }}
          DATABASE: ${{ needs.database.result }}
          NATIVE: ${{ needs.native.result }}
        run: test "$CHANGES" = success && test "$VERIFY" = success && test "$DATABASE" = success && { test "$NATIVE" = success || test "$NATIVE" = skipped; }
