name: CI
on:
  push: { branches: [main] }
  pull_request: {}
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npm install --global pnpm@11.9.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @paytsek/contracts run build
      - run: pnpm --filter @paytsek/receipt-parsers run build
      - run: pnpm -r run typecheck
      - run: pnpm --filter @paytsek/api test
      - run: pnpm --filter @paytsek/contracts test
      - run: git diff --check
