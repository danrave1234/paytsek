name: PayTsek Node and pnpm
description: Reproducible runtime and cached frozen workspace install
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.9.0
        run_install: false
    - uses: actions/setup-node@v5
      with:
        node-version: 24.21.0
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
